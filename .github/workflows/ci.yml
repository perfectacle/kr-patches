name: ci

# Only checks that need no ROM. Builds and byte-for-byte IPS comparisons run
# locally, since ROMs are never committed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are superseded by newer pushes; main runs always finish.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.5
          enable-cache: true

      - name: No ROM data in the repository
        run: |
          if git ls-files -- '*.sfc' '*.smc' '*.srm' '*.mss' '*.nds' '*.sav' '*.dsv' '*.state' | grep .; then
            echo '::error::ROMs, save RAM and save states are never committed'
            exit 1
          fi

      # The agent guide is Korean only; every other document is a README.md / README.ko.md style pair.
      - name: English and Korean documents come in pairs
        run: |
          missing=0
          while IFS= read -r f; do
            case "$f" in
              *.ko.md) other="${f%.ko.md}.md" ;;
              *) other="${f%.md}.ko.md" ;;
            esac
            if [ ! -f "$other" ]; then
              echo "::error file=$f::$other is missing"
              missing=1
            fi
          done < <(git ls-files -- '*.md' ':!:AGENTS.md' ':!:CLAUDE.md' ':!:.agents/**')
          exit "$missing"

      - name: Install Lua 5.4 and zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 zsh

      - name: Check Lua syntax
        run: git ls-files -z '*.lua' | xargs -0 -n1 luac5.4 -p

      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 zsh -n

      - run: uv sync --locked

      - name: Compile Python
        run: .venv/bin/python -m compileall -q sfc nds

      - name: Check kr_patch imports
        run: |
          .venv/bin/python - <<'PY'
          import ast, importlib, importlib.util, subprocess, sys
          bad = []
          for path in subprocess.run(["git", "ls-files", "*.py"], capture_output=True, text=True, check=True).stdout.split():
              for node in ast.walk(ast.parse(open(path, encoding="utf-8").read(), path)):
                  if isinstance(node, ast.ImportFrom) and node.module and node.module.split(".")[0] == "kr_patch":
                      mod = importlib.import_module(node.module)
                      bad += [f"{path}: {node.module}.{a.name}" for a in node.names
                              if not hasattr(mod, a.name) and importlib.util.find_spec(f"{node.module}.{a.name}") is None]
                  elif isinstance(node, ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] == "kr_patch":
                              importlib.import_module(a.name)
          print("\n".join(bad) or "kr_patch imports ok")
          sys.exit(1 if bad else 0)
          PY

      - name: Totsugeki-hen dialogue layout
        working-directory: sfc/dragon-ball-z-super-gokuden-totsugeki
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" tools/layout1.py tables/v1.1/dialogue.tsv | tee /dev/stderr | tail -1 | grep -qx '0 lines with problems'

  actionlint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      # One place for the version: the cache key and the run both read it, and Renovate updates it.
      ZIZMOR: zizmor==1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        run: |
          {
            echo "version=$(python3 --version | cut -d ' ' -f 2)"
            echo "pipx=$(pipx --version)"
            echo "venvs=$(pipx environment --value PIPX_VENV_CACHEDIR)"
            echo "pip=$(python3 -m pip cache dir)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.python.outputs.venvs }}
            ${{ steps.python.outputs.pip }}
          key: zizmor-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.version }}-pipx-${{ steps.python.outputs.pipx }}-${{ env.ZIZMOR }}

      # Pin the interpreter too: pipx's run cache includes its Python path.
      - run: pipx run --python "$(command -v python3)" "$ZIZMOR" --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # The one required status check on main: passes only when every job above passed.
  ci-ok:
    if: always()
    needs: [check, actionlint, zizmor]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
